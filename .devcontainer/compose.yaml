name: rite-lite-dev

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ${LOCAL_WORKSPACE_FOLDER:-..}:/workspaces/rite-lite:cached
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ConnectionStrings__TripDb: "Server=sqlserver,1433;Database=TripDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .devcontainer/.env};Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__MatchingDb: "mongodb://swiftdev:${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .devcontainer/.env}@mongodb:27017/MatchDB?authSource=admin"
      ConnectionStrings__PaymentDb: "Host=postgres;Port=5432;Database=PayDB;Username=swiftdev;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .devcontainer/.env}"
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: swiftdev
      RabbitMq__Password: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .devcontainer/.env}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      mongodb-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started
      otel-collector:
        condition: service_started

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .devcontainer/.env}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/bin/bash", "/tmp/init-sqlserver.sh"]
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .devcontainer/.env}"
    volumes:
      - ./init-sqlserver.sh:/tmp/init-sqlserver.sh:ro
    depends_on:
      - sqlserver

  mongodb:
    image: mongo:8.0.30-noble
    environment:
      MONGO_INITDB_ROOT_USERNAME: swiftdev
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .devcontainer/.env}"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  mongodb-init:
    image: mongo:8.0.30-noble
    entrypoint: ["/bin/sh", "/tmp/init-mongodb.sh"]
    environment:
      MONGO_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .devcontainer/.env}"
    volumes:
      - ./init-mongodb.sh:/tmp/init-mongodb.sh:ro
    depends_on:
      - mongodb

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: PayDB
      POSTGRES_USER: swiftdev
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .devcontainer/.env}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: swiftdev
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .devcontainer/.env}"
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  otel-collector:
    image: otel/opentelemetry-collector:0.161.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  sqlserver_data:
  mongodb_data:
  postgres_data:
  rabbitmq_data:
